# Golden expectations: what the user knows to be true about specific videos.
#
# Development checks, NOT validation data. They catch the system producing
# results the user can see are wrong (every item below comes from a problem
# the user found by hand). The professor's manual scores are never used here
# and must never be added here — tuning to them and then "validating" against
# them would be circular.
#
# status: draft      written by Claude from the user's own statements; the user
#                    has not yet confirmed the exact wording / threshold
#         confirmed  the user has confirmed it (record the date)
#
# Every check runs on every `tools/loop_check.sh`. A failing check blocks
# "done", whatever its status. Add one whenever a new problem is found by hand.

checks:

