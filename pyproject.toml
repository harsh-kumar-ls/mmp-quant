[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mmpquant"
version = "0.1.0"
description = "Quantifying Mayer's Redundancy Principle in educational videos"
requires-python = ">=3.11"
dependencies = [
    # media
    "numpy>=1.26",
    "Pillow>=10.2",
    # ASR
    "faster-whisper>=1.0.3",
    # OCR (PP-OCRv4 weights served through ONNXRuntime, not the Paddle framework)
    "rapidocr-onnxruntime>=1.3.24",
    # semantic overlap
    "sentence-transformers>=3.0",
    # sentence-vs-label classification: supplies VerbForm=Fin, which separates a
    # headline ("How to make a video") from an assertion ("Water boils").
    # The parser model (en_core_web_trf, see config.yaml) is installed separately:
    #   uv pip install "en_core_web_trf @ https://github.com/explosion/spacy-models/releases/download/en_core_web_trf-3.8.0/en_core_web_trf-3.8.0-py3-none-any.whl"
    "spacy>=3.8",
    # real-word check: separates OCR misreads ("moguehiin") from English words,
    # which spaCy's small model cannot do (it marks every token out-of-vocabulary)
    "wordfreq>=3.0",
    # plumbing
    "PyYAML>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    # validation harness (step 4)
    "pandas>=2.2",
    "scipy>=1.13",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-cov>=5.0", "ruff>=0.5"]
# Local single-user web UI: upload a video, watch it score, read the report.
# Not part of the research pipeline itself — `mmpquant score`/`validate` never
# depend on this group, so the CLI and the thesis numbers it produces are
# unaffected by whether a browser is ever opened.
webapp = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "python-multipart>=0.0.9"]

[project.scripts]
mmpquant = "mmpquant.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/mmpquant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
extend-ignore = [
    # Typer declares CLI defaults as typer.Argument(...)/typer.Option(...) calls;
    # that is the framework's documented idiom, not an accidental mutable default.
    "B008",
    # subprocess return codes are inspected explicitly so the failure message can
    # include the command line and stderr tail, which check=True discards.
    "PLW1510",
]
